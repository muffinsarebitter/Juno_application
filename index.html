<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juno Travel Concierge</title>
<meta name="theme-color" content="#15302a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juno">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a travel magazine masthead over a two-column spread. Left: Juno (the suitcase
   concierge) and a boarding pass that fills in as you answer. Right: the chapter you are on. */
:root{
  --paper:#eef0e9; --card:#fbfbf7; --ink:#15302a; --muted:#5d6f69; --line:#c9cfc4;
  --brass:#9a7426; --brass-soft:#ead9ae; --rose:#e3a59b; --deep:#15302a; --on-deep:#f3f1e6;
  --display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1917; --card:#16241f; --ink:#ece9dc; --muted:#9aaba3; --line:#2c3d37;
    --brass:#d9b769; --brass-soft:#3a3320; --rose:#e3a59b; --deep:#1d302a; --on-deep:#f3f1e6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1917; --card:#16241f; --ink:#ece9dc; --muted:#9aaba3; --line:#2c3d37;
  --brass:#d9b769; --brass-soft:#3a3320; --rose:#e3a59b; --deep:#1d302a; --on-deep:#f3f1e6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.08}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}

/* masthead */
.mast{padding:22px 0 0;display:grid;gap:12px}
.mast-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.logo{font-family:var(--display);font-size:clamp(44px,9vw,84px);letter-spacing:.04em;line-height:.9;text-align:center}
.logo i{color:var(--brass);font-weight:400}
.rule{border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);height:4px;margin:0}
.tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:1px solid transparent;border-radius:999px;padding:7px 18px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}

.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:600}
.notice{margin:16px 0 0;padding:12px 16px;border:1px solid var(--brass);background:var(--brass-soft);border-radius:10px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
[hidden]{display:none!important}

/* spread */
.spread{display:grid;grid-template-columns:330px 1fr;gap:36px;margin-top:30px;align-items:start}
.side{position:sticky;top:16px;display:grid;gap:18px}
@media (max-width:860px){.spread{grid-template-columns:1fr;gap:22px}.side{position:static}}

/* Juno */
.juno{display:flex;gap:12px;align-items:flex-end}
.juno svg{width:92px;flex:none;animation:bob 3.2s ease-in-out infinite}
.juno .eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.juno svg,.juno .eye,.dots i{animation:none!important}}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 15px;font-size:15px;flex:1;min-width:0}
.bubble b{font-family:var(--display);font-style:italic;font-weight:500;font-size:17px}

/* boarding pass */
.pass{background:var(--deep);color:var(--on-deep);border-radius:16px;overflow:hidden;font-size:13px}
.pass-head{display:flex;justify-content:space-between;padding:12px 16px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
.route{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 16px 14px}
.route div{min-width:0}
.route strong{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.route small,.pass dt{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.65}
.route .plane{flex:none;color:#d9b769;font-size:18px}
.perf{border-top:2px dashed rgba(243,241,230,.35);margin:0 10px}
.pass dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0;padding:14px 16px}
.pass dd{margin:1px 0 0;font-weight:600;overflow-wrap:anywhere}
.pass dd.empty{opacity:.4;font-weight:400}
.pass .wide{grid-column:1/-1}
.barcode{height:26px;margin:0 16px 14px;background:repeating-linear-gradient(90deg,var(--on-deep) 0 2px,transparent 2px 5px,var(--on-deep) 5px 6px,transparent 6px 11px);opacity:.6}

/* chapter */
.chapter{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,38px)}
.chapter h2{font-size:clamp(30px,5vw,46px);margin:6px 0 4px}
.chapter h2 em{color:var(--brass)}
.lede{color:var(--muted);max-width:60ch;margin:0 0 22px}
.progress{display:flex;gap:5px;margin-bottom:18px}
.progress i{height:3px;flex:1;background:var(--line);border-radius:2px}
.progress i.on{background:var(--brass)}
.field{margin:0 0 24px}
.field>label,.field>.lab{display:block;font-weight:600;margin-bottom:9px}
.field .hint{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;font-size:14.5px;transition:transform .12s,background .15s,border-color .15s}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.chip small{display:block;font-size:11.5px;opacity:.7}
.chip.big{border-radius:14px;padding:10px 16px;text-align:left}
input[type=text],textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
input[type=text]:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{resize:vertical;min-height:70px}
.count{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--paper)}
.count button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);cursor:pointer;font-size:18px}
.count output{font-family:var(--display);font-size:22px;min-width:1.4em;text-align:center}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.duel .chip{border-radius:14px;text-align:center;padding:11px 10px}
.duel span{font-family:var(--display);font-style:italic;color:var(--muted);font-size:14px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:none;border-radius:999px;padding:11px 24px;cursor:pointer;font-weight:600;font-size:14px;letter-spacing:.04em;text-decoration:none;display:inline-block}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.gold{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.btn.gold:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 14px;font-size:12.5px}

/* loading */
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);padding:18px 0;font-style:italic;font-family:var(--display);font-size:18px}
.dots{display:inline-flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brass);animation:hop 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-6px);opacity:1}}

/* matches */
.matches{display:grid;gap:14px;margin-top:8px}
.match{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--paper)}
.match .no{font-family:var(--display);font-style:italic;font-size:54px;line-height:.9;color:var(--brass);grid-row:span 3}
.match h3{font-size:30px}
.match h3 small{font-family:var(--body);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.match p{margin:2px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.fit{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
.meta{font-size:13.5px;color:var(--muted)}
@media (max-width:520px){.match{grid-template-columns:1fr}.match .no{grid-row:auto;font-size:38px}}

/* plan article */
.article h2{font-size:clamp(34px,6vw,58px)}
.article .standfirst{font-family:var(--display);font-style:italic;font-size:20px;line-height:1.4;max-width:58ch;margin:12px 0 6px}
.sec{border-top:1px solid var(--line);margin-top:30px;padding-top:22px}
.sec>h3{font-size:28px;margin:4px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper);display:flex;flex-direction:column;gap:5px}
.card h4{font-family:var(--display);font-weight:600;font-size:19px;margin:0;line-height:1.2}
.card p{margin:0;font-size:14.5px}
.card .meta{margin-top:auto;padding-top:6px}
.maplink{font-size:12.5px;color:var(--brass);font-weight:600;text-decoration:none;letter-spacing:.04em}
.maplink:hover{text-decoration:underline}
.day{display:grid;grid-template-columns:74px 1fr;gap:16px;padding:16px 0;border-bottom:1px dashed var(--line)}
.day:last-child{border-bottom:0}
.day .n{font-family:var(--display);font-size:44px;line-height:.9;color:var(--brass)}
.day .n small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.day h4{font-family:var(--display);font-style:italic;font-weight:500;font-size:21px;margin:0 0 8px}
.slot{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:14.5px;margin-bottom:6px}
.slot b{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.daytip{font-size:13.5px;color:var(--muted);margin:6px 0 0;padding-left:96px}
@media (max-width:520px){.day{grid-template-columns:1fr;gap:4px}.slot{grid-template-columns:1fr;gap:0}.daytip{padding-left:0}}
.know{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 26px}
.know p{margin:0 0 10px;font-size:14.5px}
.know b{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.tweak{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tweak input{flex:1;min-width:200px}
.fine{font-size:12.5px;color:var(--muted);margin-top:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

/* guide */
.guide{display:grid;grid-template-columns:330px 1fr;gap:36px;margin-top:30px;align-items:start}
@media (max-width:860px){.guide{grid-template-columns:1fr;gap:22px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.panel label{font-weight:600;font-size:14px;display:grid;gap:6px}
.quick{display:flex;flex-wrap:wrap;gap:7px}
.quick .chip{font-size:13.5px;padding:7px 12px}
.chat{background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:540px;max-height:78vh}
.chat-head{padding:16px 20px;border-bottom:1px solid var(--line)}
.chat-head h2{font-size:28px}
.msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(78%,560px);padding:11px 15px;border-radius:18px;font-size:15px;overflow-wrap:anywhere}
.msg.j{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.u{background:var(--deep);color:var(--on-deep);border-bottom-right-radius:4px;align-self:flex-end}
.msg .say{display:block;margin-top:6px;background:none;border:0;padding:0;color:var(--brass);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.06em}
.composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-top"><span>The Travel Concierge</span><span id="today"></span><span>Personal edition</span></div>
    <div class="logo">J<i>u</i>no</div>
    <hr class="rule">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-plan" data-view="plan">Plan a trip</button>
      <button class="tab" role="tab" id="tab-guide" data-view="guide">City guide</button>
    </nav>
  </header>


  <main id="view-plan" class="spread">
    <aside class="side">
      <div class="juno">
        <svg viewBox="0 0 120 130" aria-hidden="true">
          <path d="M44 30v-9a8 8 0 0 1 8-8h16a8 8 0 0 1 8 8v9" fill="none" stroke="#9a7426" stroke-width="5" stroke-linecap="round"/>
          <rect x="16" y="30" width="88" height="78" rx="18" fill="#1f463d"/>
          <rect x="16" y="30" width="88" height="78" rx="18" fill="none" stroke="#0f2a24" stroke-width="3"/>
          <path d="M16 56h88M16 84h88" stroke="#d9b769" stroke-width="3" opacity=".8"/>
          <ellipse class="eye" cx="46" cy="68" rx="5" ry="6.5" fill="#fbfbf7"/>
          <ellipse class="eye" cx="74" cy="68" rx="5" ry="6.5" fill="#fbfbf7"/>
          <circle cx="36" cy="77" r="5" fill="#e3a59b" opacity=".85"/><circle cx="84" cy="77" r="5" fill="#e3a59b" opacity=".85"/>
          <path d="M54 76q6 6 12 0" fill="none" stroke="#fbfbf7" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M100 40l12 10-4 16-12-6z" fill="#ead9ae" stroke="#9a7426" stroke-width="2"/>
          <circle cx="104" cy="48" r="1.8" fill="#9a7426"/>
          <rect x="30" y="108" width="12" height="9" rx="4" fill="#0f2a24"/><rect x="78" y="108" width="12" height="9" rx="4" fill="#0f2a24"/>
        </svg>
        <div class="bubble" id="bubble" aria-live="polite"></div>
      </div>
      <div class="pass" id="pass"></div>
    </aside>
    <section id="stage" aria-live="polite"></section>
  </main>

  <main id="view-guide" class="guide" hidden>
    <aside class="panel">
      <span class="eyebrow">Where are you right now?</span>
      <label for="g-city">City
        <input type="text" id="g-city" placeholder="Lisbon">
      </label>
      <label for="g-where">What you can see around you
        <textarea id="g-where" placeholder="A street name, a metro station, a shop sign, a landmark"></textarea>
      </label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="btn sm" id="g-gps">📍 Use my location</button><span class="meta" id="g-gps-note" aria-live="polite"></span></div>
      <a class="maplink" id="g-map" target="_blank" rel="noopener" href="#" hidden>Open this spot in Maps</a>
      <span class="eyebrow">Ask in one tap</span>
      <div class="quick" id="quick"></div>
      <p class="fine" style="margin:0">Your location is only used to answer your questions and is not stored. In an emergency, call the local emergency number first.</p>
    </aside>
    <section class="chat">
      <div class="chat-head"><span class="eyebrow">Juno, walking beside you</span><h2>Your pocket <em>guide</em></h2></div>
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="composer">
        <input type="text" id="g-input" placeholder="Ask Juno anything about where you are" autocomplete="off" aria-label="Message Juno">
        <button class="btn gold" id="g-send">Send</button>
      </form>
    </section>
  </main>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maps = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const arr = v => Array.isArray(v) ? v : [];

/* ---------- questionnaire ---------- */
const CHAPTERS = [
  { title:"First, <em>you</em>", lede:"A good concierge starts with the traveller, not the map.",
    juno:p=>p.name?`Lovely to meet you, <b>${esc(p.name)}</b>. Tell me who is coming along.`:"Hello! I'm <b>Juno</b>, your travelling suitcase and concierge. What should I call you?",
    fields:[
      {k:"name",type:"text",label:"Your first name",ph:"Hala"},
      {k:"from",type:"text",label:"Where are you travelling from?",ph:"Beirut, Lebanon"},
      {k:"party",type:"one",label:"Who is coming?",opts:["🧳 Just me","💞 Me and my partner","🥂 A group of friends","🧸 Family with kids","👪 Family, all adults"]},
      {k:"count",type:"count",label:"How many travellers in total?"},
      {k:"age",type:"one",label:"Your age range",hint:"helps me pick the right energy",opts:["18–24","25–34","35–49","50–64","65+"]}
    ]},
  { title:"The <em>shape</em> of the trip", lede:"Dates, length and budget decide more than anything else.",
    juno:()=>"Now the practical bits. Be honest about the budget, I never judge.",
    fields:[
      {k:"when",type:"text",label:"When would you like to go?",hint:"a month, a season or exact dates",ph:"Late March, or 12–19 April"},
      {k:"length",type:"one",label:"How long?",opts:["Long weekend (3 nights)","5 nights","1 week","10 nights","2 weeks"]},
      {k:"budget",type:"one",big:true,label:"Budget per person, flights not included",opts:["Smart saver|under $80 a day","Comfortable|$80–180 a day","Treat myself|$180–400 a day","No limits|$400+ a day"]},
      {k:"occasion",type:"one",label:"Is this trip for something special?",opts:["Just because","Birthday","Honeymoon or anniversary","Graduation","I need a reset","Work plus a few days off"]}
    ]},
  { title:"What makes you <em>happy</em>", lede:"Pick everything that makes you say yes. There are no wrong answers.",
    juno:p=>p.vibes.length>4?"Ooh, you have range. I like you already.":"Tap as many as you like. This is the part I enjoy most.",
    fields:[
      {k:"vibes",type:"many",label:"I travel for",opts:["🏖 Beaches","🏛 Old towns and history","🍜 Food","🎨 Art and museums","🥾 Nature and hikes","🪩 Nightlife","🛍 Shopping","🧖 Spa and wellness","🪂 Adventure","📷 Photography","🌹 Romance","🦓 Wildlife","⛷ Snow","🎭 Festivals and culture","🏗 Architecture","☕ Cafés and slow mornings"]},
      {k:"pace",type:"one",big:true,label:"Your pace",opts:["Slow and dreamy|one or two things a day","Balanced|busy mornings, easy evenings","See it all|I can sleep at home"]},
      {k:"climate",type:"many",label:"Weather you want",opts:["☀️ Warm and sunny","🌤 Mild","🍂 Cool and crisp","❄️ Snowy","No preference"]}
    ]},
  { title:"Where you <em>sleep</em> and what you eat", lede:"The hotel sets the mood for the whole trip.",
    juno:()=>"I will pick hotels the way a friend would: by how they feel, not just by stars.",
    fields:[
      {k:"stay",type:"many",label:"Places I like to stay",opts:["Boutique hotel","Grand luxury hotel","Beach resort","Cosy guesthouse or riad","Apartment of my own","Social hostel","Something unusual"]},
      {k:"stayMust",type:"many",label:"My room must have",opts:["Walkable location","Quiet nights","A view","Pool","Great breakfast","Gym","Free cancellation"]},
      {k:"food",type:"many",label:"How I like to eat",opts:["Street food","Fine dining","Local home cooking","Cafés and pastries","Seafood","Rooftops and views","Markets"]},
      {k:"diet",type:"text",label:"Dietary needs or allergies",hint:"optional",ph:"Halal, vegetarian, no shellfish"}
    ]},
  { title:"This or <em>that</em>", lede:"Quick fire. Go with your first instinct.",
    juno:()=>"Don't think. Just tap. I learn a lot from these.",
    fields:[{k:"duel",type:"duel",pairs:[["Sunrise person","Night owl"],["Plan every hour","Wander freely"],["Famous icons","Hidden corners"],["Big city buzz","Small town calm"],["Walk everywhere","Taxi, please"],["Try everything new","Comforts I know"]]}]},

async function post(path, body){
  let r;
  try{ r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }
  catch(e){ throw {code:"offline"}; }
  if(r.status===429) throw {code:"rate_limited"};
  if(!r.ok){ let m = ""; try{ m = (await r.json()).detail || ""; }catch(e){} throw {code:"server", message:m}; }
  return r;
}
const sample = async (messages, opts={})=>{
  const r = await post("/api/chat",{messages}), rd = r.body.getReader(), dec = new TextDecoder();
  let text = "";
  for(;;){ const {done,value} = await rd.read(); if(done) break; text += dec.decode(value,{stream:true}); if(opts.onText) opts.onText({text}); }
  return {text};
};
sample.json = async prompt => (await post("/api/json",{prompt})).json();

function explain(e){
  const c = e && e.code;
  if(c==="rate_limited") return "Juno is out of breath. Wait a minute, then try again.";
  if(c==="offline") return "Juno cannot reach her server. Check your internet connection and try again.";
  if(e && e.message && typeof e.message==="string") return e.message;
  return "Juno lost her train of thought. Please try again.";
}
async function askJSON(prompt, tier){

  add("Name",p.name); add("Travelling from",p.from); add("Party",p.party); add("Travellers",p.count); add("Age range",p.age);
  add("When",p.when); add("Length",p.length); add("Budget per person per day, excluding flights",p.budget.replace("|"," — ")); add("Occasion",p.occasion);
  add("Loves",p.vibes); add("Pace",p.pace.replace("|"," — ")); add("Weather wanted",p.climate);

async function sendGuide(text){

/* ---------- shell ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.view===S.view));
  $("#view-plan").hidden = S.view!=="plan"; $("#view-guide").hidden = S.view!=="guide";
  if(S.view==="guide"){ renderGuide(); return; }
  renderPass();
  if(S.phase==="plan" && S.dest) renderPlan(); else if(S.phase==="matches") renderMatches(); else renderQuiz();
}
function go(view){ S.view = view; try{ if(location.hash!=="#"+view) location.hash = view; }catch(e){} render(); save(); }
window.addEventListener("hashchange",()=>{ const h = location.hash.slice(1); if((h==="plan"||h==="guide") && h!==S.view){ S.view = h; render(); } });

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const p = S.p, d = t.dataset;
  if(d.view) return go(d.view);
  if(d.count){ p.count = Math.max(1, Math.min(20, p.count + (+d.count))); $("#f-count").textContent = p.count; renderPass(); return save(); }
  if(d.duel!==undefined){ p.duel[d.duel] = p.duel[d.duel]===d.v ? undefined : d.v; if(p.duel[d.duel]===undefined) delete p.duel[d.duel]; render(); return save(); }
  if(d.k && d.v!==undefined){
    if(d.many){ const a = p[d.k], i = a.indexOf(d.v); i<0 ? a.push(d.v) : a.splice(i,1); }
    else p[d.k] = p[d.k]===d.v ? "" : d.v;
    if(d.k==="destMode" && !p.destMode) p.destMode = "Surprise me";
    render(); return save();
  }
  if(d.pick!==undefined) return buildPlan(S.matches[+d.pick]);
  if(d.q) return sendGuide(d.q);
  if(d.say!==undefined && tts){ const m = S.guide.msgs[+d.say] || {t:$("#msgs .msg").textContent.replace("Read aloud","")}; tts.speak(m.t.slice(0,1900)).catch(()=>{}); return; }
  switch(d.act){
    case "next": S.step++; break;
    case "back": S.step--; break;
    case "edit": S.phase = "quiz"; break;
    case "matches": S.phase = "matches"; S.dest = null; break;
    case "go":
      if(p.destMode==="I have a place in mind" && p.destText.trim()){ S.matches = null; return buildPlan({city:p.destText.trim(),country:""}); }
      return findMatches();
    case "more": return findMatches(true);
    case "replan": return buildPlan(S.dest);
    case "guide": S.guide.city = S.dest.city; return go("guide");
    case "restart": S.phase = "quiz"; S.step = 0; S.dest = null; S.plan = null; S.days = null; S.matches = null; break;
    case "copy":
      navigator.clipboard.writeText(planText()).then(()=>{ t.textContent = "Copied"; },()=>{ t.textContent = "Copy was blocked"; }); return;
    default: return;
  }
  err = ""; render(); save(); $("#stage").scrollIntoView({block:"nearest"});
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.k){ S.p[t.dataset.k] = t.value; renderPass();
    if(t.dataset.k==="destText"){ const b = document.querySelector('[data-act="go"]'); if(b) b.disabled = !t.value.trim(); }
    if(t.dataset.k==="name") $("#bubble").innerHTML = CHAPTERS[S.step].juno(S.p);
    save(); }
  if(t.id==="g-city"){ S.guide.city = t.value; mapLink(); save(); }
  if(t.id==="g-where"){ S.guide.where = t.value; S.guide.lat = S.guide.lon = null; mapLink(); save(); }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="composer"){ const i = $("#g-input"), v = i.value; i.value = ""; sendGuide(v); }
  if(e.target.id==="tweak"){ tweakDays($("#tweak-input").value); }
});

$("#g-gps").addEventListener("click",()=>{
  const note = $("#g-gps-note");
  if(!navigator.geolocation){ note.textContent = "This device does not share location. Type where you are instead."; return; }
  note.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(async pos=>{
    const g = S.guide; g.lat = +pos.coords.latitude.toFixed(5); g.lon = +pos.coords.longitude.toFixed(5);
    try{ const r = await fetch(`/api/where?lat=${g.lat}&lon=${g.lon}`); if(r.ok){ const d = await r.json(); if(d.city) g.city = d.city; if(d.address) g.where = d.address; } }catch(e){}
    $("#g-city").value = g.city; $("#g-where").value = g.where; mapLink(); save();
    note.textContent = "Got it. Juno knows where you are.";
  }, e=>{
    note.textContent = e.code===1 ? "Location permission was declined. Allow it in your browser settings, or type where you are." : "Could not get your location. Type where you are instead.";
  }, {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

function start(data){
  load(data);
  const h = location.hash.slice(1); if(h==="plan"||h==="guide") S.view = h;
  if(S.phase==="plan" && !S.dest) S.phase = "quiz";
  if(S.phase==="matches" && !S.matches) S.phase = "quiz";
  S.guide.msgs = S.guide.msgs.filter(m=>m.t).map(m=>({r:m.r,t:m.t}));
  $("#today").textContent = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  render();
}
window.claude?.hot?.snapshot?.(()=>S);
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
